name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the workflow only checks out code and runs tests.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type-check sources and specs
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: npm test

      # Testcontainers starts Oracle Database Free on the runner's Docker.
      - name: Integration tests (Oracle)
        run: npm run test:int

      - name: End-to-end tests (HTTP + Oracle)
        run: npm run test:e2e
